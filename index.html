<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Weather Match Adventure (Offline)</title>
  <style>
    :root{
      --bg1:#f7fbff;
      --bg2:#fff7fb;
      --card:#ffffff;
      --ink:#1c2a39;
      --muted:#5c6b7a;
      --accent:#2b7cff;
      --good:#2dbf6c;
      --warn:#ffb020;
      --bad:#ff4d4d;
      --shadow: 0 10px 24px rgba(0,0,0,0.10);
      --radius: 18px;
      --tap: 76px;
      --focus: 0 0 0 4px rgba(43,124,255,0.25);
      --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: var(--font);
      color:var(--ink);
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg2), transparent 60%),
                  radial-gradient(1000px 600px at 90% 20%, var(--bg1), transparent 60%),
                  linear-gradient(180deg, #ffffff, #f2f7ff);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding: 16px;
    }
    .app{
      width:min(980px, 100%);
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
    header{
      padding: 14px 16px;
      display:flex;
      align-items:center;
      gap:12px;
      background: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .brand{ display:flex; align-items:center; gap:10px; flex:1; min-width: 0; }
    .logo{
      width:40px;height:40px;border-radius:14px;
      background: linear-gradient(135deg, #2b7cff, #7dd3fc);
      display:grid;place-items:center;
      color:white;font-size:20px;
      box-shadow: 0 8px 18px rgba(43,124,255,0.25);
    }
    .title{ line-height:1.1; min-width:0; }
    .title strong{ display:block; font-size: 16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .title span{ display:block; font-size: 12px; color: var(--muted); }
    .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .pill{
      display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(0,0,0,0.08);
      background: #fff; border-radius:999px; padding: 8px 10px; height: 44px;
    }
    .toggle{ user-select:none; display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
    .switch{ width:42px;height:24px;border-radius:999px; background: rgba(0,0,0,0.12); position:relative; transition: background .15s ease; }
    .knob{ width:18px;height:18px;border-radius:50%; background:white; position:absolute; top:3px; left:3px; transition: left .15s ease; }
    .toggle.on .switch{ background: var(--good); }
    .toggle.on .knob{ left:21px; }
    main{ padding: 16px; }
    .screen{ display:none; }
    .screen.active{ display:block; }
    .card{ background: var(--card); border: 1px solid rgba(0,0,0,0.08); border-radius: var(--radius); padding: 16px; }
    .hero{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:16px; }
    @media (max-width: 820px){ .hero{ grid-template-columns: 1fr; } }
    .bigCharacter{ display:grid; place-items:center; border-radius: var(--radius); background: linear-gradient(135deg, rgba(125,211,252,0.1), rgba(43,124,255,0.05)); border: 1px solid rgba(43,124,255,0.1); min-height: 200px; text-align:center; }
    .charFace{ font-size: 80px; }
    .nameInput{ width:100%; min-height: 56px; border-radius: 16px; border: 2px solid rgba(0,0,0,0.12); padding: 0 14px; font-size: 18px; font-weight: 800; }
    .primaryBtn, .secondaryBtn{ border:none; cursor:pointer; border-radius: 16px; padding: 14px; min-height: var(--tap); font-weight: 800; font-size: 16px; display:inline-flex; align-items:center; justify-content:center; gap:10px; }
    .primaryBtn{ background: linear-gradient(135deg, #2b7cff, #6ee7ff); color:white; }
    .secondaryBtn{ background: #fff; border: 1px solid rgba(0,0,0,0.1); }
    .board{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    @media (max-width: 600px){ .board{ grid-template-columns: 1fr; } }
    .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .matchCard{ background:#fff; border: 3px solid rgba(0,0,0,0.08); border-radius: 18px; min-height: 110px; padding: 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition: all 0.2s; }
    .matchCard.selected{ border-color: var(--accent); background: rgba(43,124,255,0.05); }
    .matchCard.correct{ border-color: var(--good); background: rgba(45,191,108,0.1); opacity: 0.6; pointer-events: none; }
    .matchCard.wrong{ border-color: var(--bad); animation: shake 0.3s; }
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    .panelOverlay{ position:absolute; inset:0; background: rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; padding: 20px; z-index: 100; }
    .panelOverlay.show{ display:flex; }
    .panel{ background:white; width:100%; max-width: 500px; border-radius: 20px; overflow:hidden; }
    .badge{ padding: 8px 12px; background: #fff; border: 1px solid #ddd; border-radius: 20px; font-weight: bold; }
    .gearBtn{ width:44px; height:44px; border-radius:12px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:20px; }
  </style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo">☁️</div>
      <div class="title"><strong id="appTitle"></strong><span id="appSubtitle"></span></div>
    </div>
    <div class="toolbar">
      <div class="pill"><div id="soundToggle" class="toggle"><div class="switch"><div class="knob"></div></div><small id="soundLabel"></small></div></div>
      <button class="gearBtn" id="gearBtn">⚙️</button>
    </div>
  </header>

  <main>
    <section id="startScreen" class="screen active">
      <div class="hero">
        <div class="card">
          <div id="storyText"></div>
          <input id="playerNameInput" class="nameInput" type="text" maxlength="12" placeholder="Name">
          <div class="actions" style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
            <button class="primaryBtn" id="startBtn">▶️ Start</button>
            <button class="secondaryBtn" id="howBtn">❓ How to play</button>
          </div>
        </div>
        <div class="card bigCharacter">
          <div class="charFace">☁️</div>
          <div id="charName" style="font-weight:bold; font-size:20px;"></div>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
        <div class="badge" id="levelBadge"></div>
        <div class="badge" id="starsBadge">⭐ <span id="starsCount">0</span></div>
        <button class="secondaryBtn" id="resetBtn" style="min-height:44px; padding:5px 15px;">🔄</button>
      </div>
      <div class="board">
        <div class="card">
          <h3 id="weatherTitle"></h3>
          <div class="grid" id="weatherGrid"></div>
        </div>
        <div class="card">
          <h3 id="itemsTitle"></h3>
          <div class="grid" id="itemsGrid"></div>
        </div>
      </div>
    </section>

    <section id="endScreen" class="screen">
      <div class="card" style="text-align:center;">
        <h1 id="endTitle"></h1>
        <div style="font-size:80px;">🏆</div>
        <p id="endText"></p>
        <button class="primaryBtn" id="backToStartBtn">🏠 Home</button>
      </div>
    </section>
  </main>

  <div class="panelOverlay" id="panelOverlay">
    <div class="panel">
      <div style="padding:15px; background:#f5f5f5; font-weight:bold; display:flex; justify-content:space-between;">
        Teacher Settings <button id="closePanelBtn" style="border:none; background:none; cursor:pointer;">✖️</button>
      </div>
      <div style="padding:20px;">
        <label>Language:</label>
        <select id="langSelect" style="width:100%; padding:10px; margin:10px 0;">
          <option value="en">English</option>
          <option value="ro">Română</option>
        </select>
        <label>Mode:</label>
        <select id="modeSelect" style="width:100%; padding:10px; margin:10px 0;">
          <option value="tap">Tap-to-match</option>
          <option value="drag" disabled>Drag-and-drop (Coming Soon)</option>
        </select>
        <button class="primaryBtn" id="applySettingsBtn" style="width:100%; margin-top:20px;">Apply</button>
      </div>
    </div>
  </div>
</div>

<script>
const ALL_PAIRS = [
  {id:1, wE:"☀️", iE:"🕶️", en:{w:"Sunny",i:"Sunglasses"}, ro:{w:"Însorit",i:"Ochelari"}},
  {id:2, wE:"🌧️", iE:"☂️", en:{w:"Rainy",i:"Umbrella"}, ro:{w:"Ploios",i:"Umbrelă"}},
  {id:3, wE:"❄️", iE:"🧤", en:{w:"Snowy",i:"Gloves"}, ro:{w:"Ninge",i:"Mănuși"}},
  {id:4, wE:"💨", iE:"🪁", en:{w:"Windy",i:"Kite"}, ro:{w:"Vânt",i:"Zmeu"}},
  {id:5, wE:"⛈️", iE:"🧥", en:{w:"Stormy",i:"Raincoat"}, ro:{w:"Furtună",i:"Pelerină"}},
  {id:6, wE:"☁️", iE:"🧺", en:{w:"Cloudy",i:"Picnic"}, ro:{w:"Înnorat",i:"Coș picnic"}}
];

const UI = {
  en: {
    title: "Weather Match", subtitle: "Ages 5-6", start: "▶️ Start", story: "Hi! Help Sunny match the gear to the weather!",
    weather: "Weather", items: "Things", level: "Level", end: "You did it!", home: "Home", sound: "Sound"
  },
  ro: {
    title: "Potrivește Vremea", subtitle: "5-6 ani", start: "▶️ Start", story: "Salut! Ajută-l pe Sunny să aleagă lucrurile potrivite!",
    weather: "Vremea", items: "Obiecte", level: "Nivel", end: "Bravo!", home: "Acasă", sound: "Sunet"
  }
};

let state = {
  lang: 'en', sound: true, level: 0, stars: 0,
  levels: [2, 4, 6], selectedWeather: null, matchesFound: 0
};

// --- DOM HELPERS ---
const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
};

function updateUI() {
  const t = UI[state.lang];
  $('appTitle').textContent = t.title;
  $('appSubtitle').textContent = t.subtitle;
  $('storyText').innerHTML = `<h3>${t.story}</h3>`;
  $('startBtn').textContent = t.start;
  $('weatherTitle').textContent = t.weather;
  $('itemsTitle').textContent = t.items;
  $('soundLabel').textContent = t.sound;
  $('backToStartBtn').textContent = t.home;
  $('endTitle').textContent = t.end;
  $('soundToggle').classList.toggle('on', state.sound);
}

function playSound(freq) {
  if (!state.sound) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.1, ctx.currentTime);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
  osc.stop(ctx.currentTime + 0.2);
}

function initLevel() {
  state.matchesFound = 0;
  state.selectedWeather = null;
  const count = state.levels[state.level];
  $('levelBadge').textContent = `${UI[state.lang].level} ${state.level + 1}`;
  
  let pairs = [...ALL_PAIRS].sort(() => 0.5 - Math.random()).slice(0, count);
  renderGrid('weatherGrid', pairs, 'weather');
  renderGrid('itemsGrid', [...pairs].sort(() => 0.5 - Math.random()), 'item');
  show('gameScreen');
}

function renderGrid(id, pairs, type) {
  const container = $(id);
  container.innerHTML = '';
  pairs.forEach(p => {
    const card = document.createElement('div');
    card.className = 'matchCard';
    card.dataset.id = p.id;
    card.innerHTML = `<span style="font-size:40px">${type==='weather'?p.wE:p.iE}</span><small>${p[state.lang][type==='weather'?'w':'i']}</small>`;
    card.onclick = () => handleSelect(card, type, p.id);
    container.appendChild(card);
  });
}

function handleSelect(el, type, id) {
  if (el.classList.contains('correct')) return;

  if (type === 'weather') {
    document.querySelectorAll('#weatherGrid .matchCard').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    state.selectedWeather = id;
    playSound(440);
  } else {
    if (!state.selectedWeather) return;
    if (state.selectedWeather === id) {
      // Correct Match
      el.classList.add('correct');
      document.querySelector(`#weatherGrid .matchCard[data-id="${id}"]`).classList.add('correct');
      state.matchesFound++;
      state.stars += 10;
      $('starsCount').textContent = state.stars;
      playSound(880);
      state.selectedWeather = null;
      if (state.matchesFound === state.levels[state.level]) {
        setTimeout(nextLevel, 1000);
      }
    } else {
      // Wrong
      el.classList.add('wrong');
      playSound(200);
      setTimeout(() => el.classList.remove('wrong'), 400);
    }
  }
}

function nextLevel() {
  state.level++;
  if (state.level >= state.levels.length) {
    $('endText').textContent = `Final Stars: ${state.stars}`;
    show('endScreen');
  } else {
    initLevel();
  }
}

// --- EVENTS ---
$('startBtn').onclick = () => {
  state.level = 0; state.stars = 0; $('starsCount').textContent = '0';
  initLevel();
};
$('gearBtn').onclick = () => $('panelOverlay').classList.add('show');
$('closePanelBtn').onclick = () => $('panelOverlay').classList.remove('show');
$('soundToggle').onclick = () => { state.sound = !state.sound; updateUI(); };
$('applySettingsBtn').onclick = () => {
  state.lang = $('langSelect').value;
  updateUI();
  $('panelOverlay').classList.remove('show');
};
$('backToStartBtn').onclick = () => show('startScreen');
$('resetBtn').onclick = () => initLevel();

// --- INIT ---
updateUI();
</script>
</body>
</html>
