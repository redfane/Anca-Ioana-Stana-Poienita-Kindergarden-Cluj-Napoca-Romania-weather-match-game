<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Air Balloon Adventure</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', Arial, sans-serif; }
body { background: linear-gradient(#87CEEB, #E6F7FF); overflow: hidden; height: 100vh; }
.hidden { display: none; }
.screen { width: 100vw; height: 100vh; padding: 20px; text-align: center; position: relative; }
h1 { font-size: 2.5rem; margin-bottom: 20px; color: #2c3e50; text-shadow: 1px 1px white; }
h2 { font-size: 1.8rem; margin: 10px 0; color: #34495e; }

/* Buttons & Inputs */
button {
    font-size: 1.4rem; padding: 15px 25px; border-radius: 25px; border: none;
    margin: 10px; cursor: pointer; background: #FFD54F;
    box-shadow: 0 5px 12px rgba(0,0,0,0.2); transition: transform 0.2s;
}
button:hover { transform: scale(1.08); }
input {
    font-size: 1.3rem; padding: 12px; border-radius: 20px; border: 2px solid #ccc;
    margin: 10px; width: 220px; text-align: center;
}

/* Character Selection */
.avatar { font-size: 3.5rem; cursor: pointer; margin: 10px; display: inline-block; padding: 10px; transition: 0.3s; }
.selected { border: 4px solid #FF5722; border-radius: 20px; background: white; transform: translateY(-5px); }

/* Layout Split: Weather Center, Balloon Right */
.game-container {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    height: 350px;
    margin-top: 20px;
}
.weather-zone { grid-column: 2; font-size: 10rem; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }
.balloon-zone { grid-column: 3; position: relative; height: 100%; width: 100%; }

/* --- Detailed CSS Balloon --- */
.hot-air-balloon {
    position: absolute; bottom: 0; right: 40px;
    transition: bottom 1s cubic-bezier(0.4, 0, 0.2, 1);
}
.balloon-top {
    width: 120px; height: 140px; 
    background: radial-gradient(circle at 30% 30%, #ff7043, #e64a19);
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    position: relative;
    box-shadow: inset -15px -15px 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.1);
    border: 2px solid #d84315;
}
.balloon-top::before {
    content: ""; position: absolute; width: 40px; height: 100%;
    left: 40px; background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
}
.ropes { position: absolute; top: 130px; left: 20px; width: 80px; height: 40px; }
.rope { position: absolute; width: 2px; height: 35px; background: #795548; top: 0; }
.rope-1 { left: 10px; transform: rotate(10deg); }
.rope-2 { right: 10px; transform: rotate(-10deg); }

.basket {
    width: 55px; height: 45px; 
    background: #8d6e63;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px),
                      repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px);
    margin: 30px auto 0;
    border-radius: 8px; position: relative;
    border: 3px solid #5d4037;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.pilot { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); font-size: 2.2rem; }

/* Animations */
.shake { animation: shake 0.5s; }
@keyframes shake {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-15px);}
    75%{transform:translateX(15px);}
}

.options { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
.option-btn { font-size: 4rem; width: 120px; height: 120px; background: white; border: 4px solid #FFD54F; }

#topBar { position: absolute; top: 10px; right: 10px; z-index: 100; }
#gear { cursor: pointer; font-size: 1.8rem; margin-left: 10px; vertical-align: middle; }

.confetti {
    position: absolute; width: 10px; height: 10px;
    animation: fall 3s linear forwards;
}
@keyframes fall { to { transform: translateY(100vh); opacity: 0; } }
</style>
</head>
<body>

<div id="topBar">
    <button id="languageToggle">RO</button>
    <span id="gear">⚙</span>
</div>

<div id="setupScreen" class="screen">
    <h1 id="title"></h1>
    <input type="text" id="playerName" maxlength="12">
    <div>
        <span class="avatar" id="boy">👦</span>
        <span class="avatar" id="girl">👧</span>
    </div>
    <button id="startBtn"></button>
</div>

<div id="storyScreen" class="screen hidden">
    <div style="margin: 40px auto; width: 120px;">
        <div class="balloon-top"></div>
        <div class="basket"></div>
    </div>
    <p id="storyText" style="font-size:1.8rem; font-weight: bold; min-height: 80px;"></p>
    <button id="continueBtn"></button>
</div>

<div id="gameScreen" class="screen hidden">
    <h2 id="captainLabel"></h2>
    <div class="game-container">
        <div class="weather-zone" id="weatherDisplay">☀️</div>
        <div class="balloon-zone">
            <div class="hot-air-balloon" id="gameBalloon">
                <div class="balloon-top"></div>
                <div class="ropes">
                    <div class="rope rope-1"></div>
                    <div class="rope rope-2"></div>
                </div>
                <div class="basket">
                    <div class="pilot" id="pilotAvatar">👦</div>
                </div>
            </div>
        </div>
    </div>
    <h2 id="questionText"></h2>
    <div class="options" id="optionsContainer"></div>
    <h2 id="feedback" style="height: 40px; margin-top: 10px;"></h2>
</div>

<div id="winScreen" class="screen hidden">
    <h1 id="winMessage"></h1>
    <div style="font-size: 10rem;">🏆</div>
    <button onclick="location.reload()">Restart</button>
</div>

<script>
const T = {
    ro:{
        title:"Aventura cu Balonul",
        placeholder:"Numele tău",
        start:"Începe aventura",
        continue:"Continuă",
        question:"Ce ajută balonul acum?",
        good:"Bravo! ✨",
        tryAgain:"Mai încearcă! ❌",
        win:"Ai ajuns la destinație!",
        captain:"Căpitanul",
        s1: (name) => `Căpitanul ${name} urcă în balonul magic.`,
        s2: "Balonul plutește peste munți și orașe.",
        s3: "Dar vremea se schimbă mereu!",
        s4: "Ajută balonul să zboare în siguranță!"
    },
    en:{
        title:"Balloon Adventure",
        placeholder:"Your name",
        start:"Start Adventure",
        continue:"Continue",
        question:"What helps the balloon now?",
        good:"Great job! ✨",
        tryAgain:"Let's try again! ❌",
        win:"You reached the destination!",
        captain:"Captain",
        s1: (name) => `Captain ${name} climbs into the magic balloon.`,
        s2: "The balloon floats over mountains and cities.",
        s3: "But the weather is always changing!",
        s4: "Help the balloon fly safely!"
    }
};

let lang="ro";
let player={name:"Explorer",avatar:"👦"};
let currentRound=0;
let requiredRounds=parseInt(localStorage.getItem("rounds"))||5;
let activeRounds = []; // This will hold the shuffled sequence

const masterRounds=[
    {weather:"☀️",correct:"👓",options:["👓","☂️","🪁"]},
    {weather:"🌧️",correct:"☂️",options:["☂️","👓","🪁"]},
    {weather:"❄️",correct:"🧤",options:["🧤","☂️","👓"]},
    {weather:"💨",correct:"🪁",options:["🪁","🧤","👓"]},
    {weather:"🌫️",correct:"🔦",options:["🔦","👓","🧤"]},
    {weather:"🌤️",correct:"🎈",options:["🎈","🪁","👓"]}
];

function updateLang(){
    document.getElementById("title").innerText=T[lang].title;
    document.getElementById("playerName").placeholder=T[lang].placeholder;
    document.getElementById("startBtn").innerText=T[lang].start;
    document.getElementById("continueBtn").innerText=T[lang].continue;
    document.getElementById("languageToggle").innerText=lang.toUpperCase();
}

document.getElementById("languageToggle").onclick=()=>{
    lang=lang==="ro"?"en":"ro";
    updateLang();
    if(!document.getElementById("storyScreen").classList.contains("hidden")) {
        storyIndex--; 
        typeStory();
    }
};

let storyIndex=0;
function typeStory(){
    const lines = [T[lang].s1(player.name), T[lang].s2, T[lang].s3, T[lang].s4];
    if(storyIndex < lines.length){
        document.getElementById("storyText").innerText = lines[storyIndex++];
    } else {
        document.getElementById("storyScreen").classList.add("hidden");
        startGame();
    }
}

function startGame(){
    // SHUFFLE THE MATCHES HERE
    activeRounds = [...masterRounds].sort(() => Math.random() - 0.5);
    
    document.getElementById("gameScreen").classList.remove("hidden");
    document.getElementById("captainLabel").innerText=`${T[lang].captain} ${player.name}`;
    document.getElementById("pilotAvatar").innerText = player.avatar;
    loadRound();
}

function loadRound(){
    if(currentRound >= requiredRounds){winGame(); return;}
    
    // Get the current round from our shuffled deck
    let round = activeRounds[currentRound % activeRounds.length];
    
    document.getElementById("weatherDisplay").innerText = round.weather;
    document.getElementById("questionText").innerText = T[lang].question;
    let container = document.getElementById("optionsContainer");
    container.innerHTML = "";
    
    let shuffledOptions = [...round.options].sort(()=>Math.random()-0.5);
    shuffledOptions.forEach(opt=>{
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        container.appendChild(btn);
    });
}

function checkAnswer(choice){
    let round = activeRounds[currentRound % activeRounds.length];
    if(choice === round.correct){
        currentRound++;
        document.getElementById("feedback").innerText = T[lang].good;
        document.getElementById("feedback").style.color = "green";
        moveBalloon();
        setTimeout(() => {
            document.getElementById("feedback").innerText = "";
            loadRound();
        }, 1200);
    } else {
        document.getElementById("feedback").innerText = T[lang].tryAgain;
        document.getElementById("feedback").style.color = "red";
        document.getElementById("gameBalloon").classList.add("shake");
        setTimeout(()=>document.getElementById("gameBalloon").classList.remove("shake"), 500);
    }
}

function moveBalloon(){
    let balloon = document.getElementById("gameBalloon");
    let step = 250 / requiredRounds;
    balloon.style.bottom = `${currentRound * step}px`;
}

function winGame(){
    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("winScreen").classList.remove("hidden");
    document.getElementById("winMessage").innerText = T[lang].win;
    launchConfetti();
}

function launchConfetti(){
    for(let i=0; i<60; i++){
        let div = document.createElement("div");
        div.className = "confetti";
        div.style.left = Math.random()*100+"vw";
        div.style.background = `hsl(${Math.random()*360},100%,50%)`;
        document.body.appendChild(div);
        setTimeout(()=>div.remove(), 3000);
    }
}

document.getElementById("gear").onclick=()=>{
    let pass = prompt("Password:");
    if(pass === "1234"){
        let r = prompt("Rounds (3-6):", requiredRounds);
        requiredRounds = Math.min(6, Math.max(3, parseInt(r)));
        localStorage.setItem("rounds", requiredRounds);
    }
};

document.getElementById("boy").onclick=function(){
    player.avatar = "👦";
    this.classList.add("selected");
    document.getElementById("girl").classList.remove("selected");
};
document.getElementById("girl").onclick=function(){
    player.avatar = "👧";
    this.classList.add("selected");
    document.getElementById("boy").classList.remove("selected");
};
document.getElementById("startBtn").onclick=()=>{
    player.name = document.getElementById("playerName").value || "Explorer";
    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("storyScreen").classList.remove("hidden");
    typeStory();
};
document.getElementById("continueBtn").onclick = typeStory;

updateLang();
</script>
</body>
</html>
